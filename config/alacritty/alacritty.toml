# Symlinked from ~/.config/alacritty/alacritty.toml via fresh.sh
# https://alacritty.org/config-alacritty.html

[terminal]
shell = { program = "/bin/zsh", args = ["-l"] }

[font]
size = 13.0
# Powerline glyphs for the Agnoster prompt. Family name of ~/Library/Fonts/Inconsolata for Powerline.otf
normal = { family = "Inconsolata for Powerline" }

[window]
padding = { x = 8, y = 8 }

[scrolling]
history = 10000

# Cmd+1..9 switches tmux windows, like browser tabs.
# \u0001 is Ctrl-a, the tmux prefix in ~/.tmux.conf.
# Alacritty reloads this file on save.

[[keyboard.bindings]]
key = "1"
mods = "Command"
chars = "\u00011"

[[keyboard.bindings]]
key = "2"
mods = "Command"
chars = "\u00012"

[[keyboard.bindings]]
key = "3"
mods = "Command"
chars = "\u00013"

[[keyboard.bindings]]
key = "4"
mods = "Command"
chars = "\u00014"

[[keyboard.bindings]]
key = "5"
mods = "Command"
chars = "\u00015"

[[keyboard.bindings]]
key = "6"
mods = "Command"
chars = "\u00016"

[[keyboard.bindings]]
key = "7"
mods = "Command"
chars = "\u00017"

[[keyboard.bindings]]
key = "8"
mods = "Command"
chars = "\u00018"

[[keyboard.bindings]]
key = "9"
mods = "Command"
chars = "\u00019"
