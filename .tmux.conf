# Prefix: Ctrl-a (easier to reach than default Ctrl-b).
# Ctrl-a Ctrl-a still sends a literal Ctrl-a (start of line in the shell).
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# 1-based window/pane indices; close gaps when a window is closed
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Closing a session switches to another one instead of leaving tmux.
# Sessions are projects: this keeps you inside the multiplexer.
set -g detach-on-destroy off

# Faster Escape (vim); true color; let apps know the terminal is focused
set -s escape-time 0
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",tmux-256color:RGB"
set -g focus-events on
set -g history-limit 10000

# Mouse: scroll, resize panes, select windows.
# Turn this off later if you want Alacritty's own rectangular selection.
set -g mouse on
set -g set-clipboard on

# Vi-style copy mode. y and mouse selection copy to the macOS clipboard.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind L last-window

# Splits and new windows start in the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# prefix N: new session (a new project) in this directory.
# prefix $ renames it. prefix s lists sessions (built-in choose-tree).
bind N new-session -c "#{pane_current_path}"

# Status bar: session name (the project) on the left, time on the right.
set -g status-bg colour233
set -g status-fg white
set -g status-left '#[fg=green] #S '
set -g status-left-length 24
set -g status-right '#[fg=green]%d.%m. %H:%M '
set -g status-right-length 20
setw -g window-status-current-style fg=black,bg=green

# Dim inactive panes; green border on the active one.
set -g window-style 'bg=#101010'
set -g window-active-style 'bg=#151515'
set -g pane-border-style fg=colour238,bg=#101010
set -g pane-active-border-style fg=colour113,bg=#151515

# Reload config
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"

# Keep SSH agent and PATH in sync when attaching on macOS
set -g update-environment "SSH_AUTH_SOCK PATH"
